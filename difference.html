<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Difference Calculator</title>
</head>
<body>
    <h1>Date Difference Calculator</h1>
    <form action="/calculate" method="post">
        <label for="date1">Date 1:</label>
        <input type="number" id="date1" name="date1" required>
        <br><br>
        <input type="month" id="month1" name="month1" required>
        <br><br>
        <label for="date2">Date 2:</label>
        <input type="number" id="date2" name="date2" required>
        <br><br>
        <input type="month" id="month2" name="month2" required>
        <br><br>
        <input type="submit" value="Calculate Difference">
    </form>
    {% if difference is not none %}
        <h2>Difference: {{ difference }} days</h2>
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
    {% endif %}
</body>
</html>
