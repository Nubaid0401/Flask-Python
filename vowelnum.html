<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowel Calculator</title>
    <p align="center">Enter a string to count the vowels!</p>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .header {
            background-color: #007BFF;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .content {
            margin: 20px auto;
            width: 50%;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input[type="text"] {
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div align="center">
        <div class="header">
            <h1>Vowel Calculator</h1>
        </div>
        <div class="content">
            <form method="post" action="/vowelnum">
                <input type="text" name="input_string" placeholder="Enter a string" required>
                <input type="submit" value="Count Vowels">
            </form>
            {% if vowel_count is not none %}
                <h2>Vowel Count: {{ vowel_count }}</h2>
            {% endif %}
        </div>
    </div>
</body>
</html>
