<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume templates</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ecbcbc;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .header {
            background-color: #007BFF;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        .content {
            margin: 20px auto;
            width: 50%;
            background-color: rgb(199, 190, 190);
            padding: 20px;
            box-shadow: 0 0 10px rgba(19, 14, 14, 0.1);
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1 align="center">Resume Templates</h1>
    <p align="center">Welcome to the Resume Templates page, {{ username }}!</p>
    <div align="center">
        <div class="header">
            <h2>My Resume</h2>
        </div>
        <div class="content">
            <form action="/generate_resume" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>
                <label for="education">Education:</label>
                <textarea id="education" name="education" placeholder="Enter your education details" rows="4" cols="50" required></textarea><br><br>
                <label for="experience">Experience:</label>
                <textarea id="experience" name="experience" placeholder="Enter your experience details" rows="4" cols="50" required></textarea><br><br>
                <label for="color">Color of Resume:</label>
                <input for="color" id="color" name="color" type="color" value="#000000" required><br><br>
                <input type="submit" value="Generate Resume">
            </form>
        </div>
        <div align="center">
            <form action="/logout" method="post">
                <input type="submit" value="Logout">
            </form>
        </div>
    </div>
</body>
</html>
